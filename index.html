    <!-- Favicons — SVG first (modern browsers, scales perfectly), then
         PNG sizes for legacy + mobile platforms. All rendered from
         public/favicon.svg via scripts/generate-favicons.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32"   href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16"   href="/favicon-16x16.png" />

    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Per-request CSP nonce. Middleware substitutes __CSP_NONCE__ with a
         base64url random value on every HTML response, and the `style-src`
         directive in the response CSP header allows `'nonce-<that value>'`
         so Fluent UI's Griffel renderer can attach the same nonce to every
         runtime-injected <style> tag. See src/main.jsx for the Griffel wiring. -->
    <meta name="csp-nonce" content="__CSP_NONCE__" />

    <!-- Preload self-hosted variable fonts so the browser fetches them in
         parallel with the CSS rather than waiting to discover the @font-face
         rule. Saves ~100-200ms on FCP. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-Variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/GeistMono-Variable.woff2" crossorigin />

    <!-- Preconnect / DNS prefetch for third-party origins (fonts, analytics, tag manager) -->

    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!-- Self-referencing canonical URL.
         The default <link rel="canonical"> above points at the homepage
         because Vite serves one index.html for every route (SPA). Googlebot
         reads this static HTML first, so a hardcoded homepage canonical
         tells Google every page is the homepage and tanks indexation of
         /leadgen, /blog, /blog/{slug}, /services, etc.

         This inline script runs synchronously before any module loads,
         replaces the canonical + og:url with the actual URL Googlebot
         requested, and also strips the trailing slash for consistency
         with the sitemap. The SPA's useSEO hook will overwrite this on
         hydration but the values match — no double-update flash.

         Per Google: https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls -->
    <script>
      (function () {
        try {
          var path = window.location.pathname;
          // Collapse multiple slashes and strip trailing slash (except for "/")
          path = path.replace(/\/+/g, "/").replace(/\/$/, "") || "/";
          var canonical = "https://simpleitsrq.com" + path;
          var link = document.querySelector('link[rel="canonical"]');
          if (link) link.setAttribute("href", canonical);
          var og = document.querySelector('meta[property="og:url"]');
          if (og) og.setAttribute("content", canonical);
        } catch (e) { /* stay with the static fallback */ }
      })();
    </script>

    <!-- Google AdSense — site verification (meta) + script loader.
         Loading the script in <head> is what AdSense's site-review crawler
         expects to see; loading it later via JS delays approval. The
         script respects Consent Mode v2 (set by ga-init.js above-line in
         the load order via /ga-init.js → window.dataLayer/gtag), so no
         personalized ads or marketing cookies fire until the visitor
         opts in via the cookie banner. The src/components/AdSense.jsx
         AdUnit component still gates the rendered <ins> slots on
         marketing consent. -->
    <meta name="google-adsense-account" content="ca-pub-7420716928607113" />
    <script async
            src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7420716928607113"
            crossorigin="anonymous"></script>

    <script>
      // Theme bootstrap — runs before paint to prevent FOUC.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored || (prefersDark ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0B0D10" : "#0F6CBD");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <!-- Schema.org Product JSON-LD for the Leadgen pricing tiers.

         no products are passed. -->
