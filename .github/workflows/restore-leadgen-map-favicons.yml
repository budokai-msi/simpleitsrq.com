name: Restore Leadgen map and business favicons

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-leadgen-map-favicons.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message == 'Run Leadgen map favicon restoration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch Leadgen
        run: python3 .github/scripts/restore_leadgen_map.py

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified restoration
        run: |
          git config user.name 'Simple IT SRQ release bot'
          git config user.email '114784512+budokai-msi@users.noreply.github.com'
          git rm .github/workflows/restore-leadgen-map-favicons.yml .github/scripts/restore_leadgen_map.py
          git add src/pages/Leadgen.jsx src/styles/leadgen-cards.css
          git commit -m 'Restore Leadgen map and business favicons'
          git push origin HEAD:main
