name: Verified security repair integration

on:
  push:
    branches: [main]
    paths:
      - .github/security-repair.trigger

permissions:
  contents: write

jobs:
  repair-test-build:
    if: github.event.head_commit.message == 'Run security repair integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing anchor for {label} in {path}')
              if text.count(old) != 1:
                  raise SystemExit(f'non-unique anchor for {label} in {path}: {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          # Fix invalid JS introduced in the Qwen/HN prompt integration.
          p = Path('api/cron/agent.js')
          text = p.read_text()
          bad = '.join("' + '\n' + '") : "No relevant affiliate candidate was found. Do not add a product link."}'
          good = '.join("\\n") : "No relevant affiliate candidate was found. Do not add a product link."}'
          if bad not in text:
              raise SystemExit('missing broken Qwen affiliate join anchor')
          p.write_text(text.replace(bad, good, 1))

          # The API intentionally enriches industry_counts with coverage metrics;
          # assert the stable contract without rejecting additive fields.
          replace_once(
              'api/_lib/__tests__/leadgen-api.test.js',
              'expect(data.industry_counts).toEqual([',
              'expect(data.industry_counts).toMatchObject([',
              'Leadgen additive industry-count contract',
          )

          # Defense in depth: customer actions are handled first; every admin
          # action below invoices is owner-only before its handler is reached.
          p = Path('api/portal.js')
          text = p.read_text()
          start = 'async function dispatchAuthed(request, method, url, action, session) {\n'
          if start not in text:
              raise SystemExit('missing dispatchAuthed anchor')
          text = text.replace(start, start + '  const ownerSession = session?.__viaToken === true || session?.user?.isAdmin === true;\n', 1)

          replacements = {
              '  if (action === "ticket"          && method === "PATCH") return handleTicketPatch(session, request);':
              '  if (action === "ticket"          && method === "PATCH") return ownerSession ? handleTicketPatch(session, request) : json(403, { ok: false, error: "forbidden" });',
              '  if (action === "ticket-cc"       && method === "POST")  return handleTicketCc(session, request);':
              '  if (action === "ticket-cc"       && method === "POST")  return ownerSession ? handleTicketCc(session, request) : json(403, { ok: false, error: "forbidden" });',
              '  if (action === "ticket-appointment"        && method === "POST") return handleTicketAppointment(session, request);':
              '  if (action === "ticket-appointment"        && method === "POST") return ownerSession ? handleTicketAppointment(session, request) : json(403, { ok: false, error: "forbidden" });',
              '  if (action === "ticket-appointment-cancel" && method === "POST") return handleTicketAppointmentCancel(session, request);':
              '  if (action === "ticket-appointment-cancel" && method === "POST") return ownerSession ? handleTicketAppointmentCancel(session, request) : json(403, { ok: false, error: "forbidden" });',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing portal admin mutation anchor: {old}')
              text = text.replace(old, new, 1)

          invoice = '  if (action === "invoices"        && method === "GET")   return handleInvoices(session);\n'
          if invoice not in text:
              raise SystemExit('missing invoices boundary anchor')
          text = text.replace(invoice, invoice + '  // Everything below this boundary is internal/admin. Fail closed before any handler runs.\n  if (!ownerSession) return json(403, { ok: false, error: "forbidden" });\n', 1)
          p.write_text(text)

          # Non-owner browsers never render or download the internal dashboard
          # components. The server-provided isAdmin flag is derived from the
          # hard-coded owner allowlist, so no owner email is exposed here.
          p = Path('src/App.jsx')
          text = p.read_text()
          owner_component = '''\nfunction OwnerOnlyRoute({ children }) {\n  const { user, loading } = useAuth();\n  if (loading) return <RouteFallback />;\n  if (!user?.isAdmin) return <NotFound />;\n  return children;\n}\n'''
          anchor = '\nfunction AnimatedRoutes() {'
          if anchor not in text:
              raise SystemExit('missing AnimatedRoutes anchor')
          text = text.replace(anchor, owner_component + anchor, 1)
          routes = {
              '<Route path="/portal/leadgen" element={<LeadgenDashboard />} />': '<Route path="/portal/leadgen" element={<OwnerOnlyRoute><LeadgenDashboard /></OwnerOnlyRoute>} />',
              '<Route path="/portal/ops" element={<AdminOps />} />': '<Route path="/portal/ops" element={<OwnerOnlyRoute><AdminOps /></OwnerOnlyRoute>} />',
              '<Route path="/portal/opsec" element={<AdminOps />} />': '<Route path="/portal/opsec" element={<OwnerOnlyRoute><AdminOps /></OwnerOnlyRoute>} />',
          }
          for old, new in routes.items():
              if old not in text:
                  raise SystemExit(f'missing owner route anchor: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          # Add the current request identity to critical session telemetry so a
          # proxy transition can be distinguished from an actual device swap.
          p = Path('api/_lib/session.js')
          text = p.read_text()
          old = '''                ${JSON.stringify({\n                  sessionId: row.id,\n                  originalIp: row.session_ip,\n                  originalUa: row.session_ua,\n                })}::jsonb)'''
          new = '''                ${JSON.stringify({\n                  sessionId: row.id,\n                  originalIp: row.session_ip,\n                  originalUa: row.session_ua,\n                  newIp: meta.ip,\n                  newUa: meta.ua,\n                  ipChanged,\n                  uaChanged,\n                })}::jsonb)'''
          if old not in text:
              raise SystemExit('missing session hijack telemetry anchor')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact lockfile
        run: npm ci

      - name: Verify patched dependencies
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const pkgs = lock.packages || {};
          const expected = {
            'node_modules/react-router-dom': '7.18.2',
            'node_modules/react-router': '7.18.2',
            'node_modules/brace-expansion': '5.0.7',
            'node_modules/js-yaml': '3.15.0',
          };
          for (const [key, version] of Object.entries(expected)) {
            const actual = pkgs[key]?.version;
            if (actual !== version) throw new Error(`${key}: expected ${version}, got ${actual || 'missing'}`);
            console.log(`${key} = ${actual}`);
          }
          NODE

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified repairs
        run: |
          git config user.name 'simpleitsrq-security-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add api/cron/agent.js api/_lib/__tests__/leadgen-api.test.js api/portal.js api/_lib/session.js src/App.jsx package-lock.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Harden admin access and resolve security alerts'
          git push origin HEAD:main
