name: One-time Leadgen product framing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message == 'Apply Leadgen product framing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Refine Leadgen semantics and action copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Leadgen.jsx')
          text = path.read_text()

          replacements = {
              'status: review[index] || "keep",': 'status: review[index] || "unreviewed",',
              '>Export CSV</button>': '>Download CSV</button>',
              '{pushBusy ? "Pushing…" : "Push to CRM"}': '{pushBusy ? "Sending…" : "Send to CRM"}',
              '>Save + monitor weekly</button>': '>Watch this market</button>',
              '{busy ? "Scanning…" : "Run market scan"}': '{busy ? "Searching…" : "Find businesses"}',
              '>Select B+ prospects</button>': '>Select strong matches</button>',
              '{extracting ? "Enriching…" : "Enrich intelligence"}': '{extracting ? "Checking sites…" : "Add website signals"}',
              '>Expand all</button>': '>Open all</button>',
              '>Collapse all</button>': '>Close all</button>',
              '>Keep B+ here</button>': '>Select strong matches</button>',
              '>Clear category</button>': '>Clear selections</button>',
              'See Pro features <ArrowRight size={16} />': 'Compare plans <ArrowRight size={16} />',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing Leadgen anchor: {old}')
              text = text.replace(old, new, 1)

          old_shell = '''      <div className="container leadgen-product-page">
        <LeadgenScanApp />'''
          new_shell = '''      <div className="container leadgen-product-page">
        <nav className="leadgen-breadcrumbs" aria-label="Breadcrumb">
          <ol>
            <li><Link to="/">Home</Link></li>
            <li aria-current="page">Leadgen</li>
          </ol>
        </nav>
        <LeadgenScanApp />'''
          if old_shell not in text:
              raise SystemExit('Missing Leadgen page shell anchor')
          text = text.replace(old_shell, new_shell, 1)

          path.write_text(text)
          PY

      - name: Verify and commit
        run: |
          grep -q 'status: review\[index\] || "unreviewed"' src/pages/Leadgen.jsx
          grep -q 'className="leadgen-breadcrumbs"' src/pages/Leadgen.jsx
          grep -q 'Find businesses' src/pages/Leadgen.jsx
          grep -q 'Add website signals' src/pages/Leadgen.jsx
          grep -q 'Compare plans' src/pages/Leadgen.jsx
          rm .github/workflows/one-time-leadgen-product-framing.yml
          git config user.name "Simple IT SRQ release bot"
          git config user.email "114784512+budokai-msi@users.noreply.github.com"
          git add src/pages/Leadgen.jsx .github/workflows/one-time-leadgen-product-framing.yml
          git commit -m "Refine Leadgen layout hierarchy and action copy"
          git push origin HEAD:main
