name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ── Hard gate: tests must pass before merge ──────────────────────────
  test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ── Hard gate: production build must succeed ─────────────────────────
  build:
    name: Production build (vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run prebuild (regenerate sitemap, rss, posts-meta, OG images)
        run: npm run prebuild

      - name: Build
        run: npm run build

      - name: Verify build output exists
        run: |
          if [ ! -d dist ]; then
            echo "::error::dist/ directory missing after build"
            exit 1
          fi
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html missing after build"
            exit 1
          fi
          echo "Build output verified: $(ls dist | wc -l) entries in dist/"

      - name: Verify CSS bundling
        # Regression guard for the leadgen orphan-CSS-chunk bug. Catches
        # situations where Vite splits a CSS import into a chunk that is
        # emitted but never referenced from index.html, leaving the page
        # unstyled even though the source CSS file shipped intact.
        run: node scripts/verify-css-bundling.mjs

  # ── Soft gate: lint reports errors but doesn't block (pre-existing) ──
  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Security: audit for new vulnerabilities ──────────────────────────
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit for vulnerabilities
        run: npm audit --omit=dev --audit-level=high