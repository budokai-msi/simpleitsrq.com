name: Leadgen Overture data upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/leadgen-data-v2.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Correct migration guard wording
        run: sed -i 's/It does not run domain-age, DNS, PageSpeed, or technology scoring./It only checks public contact pages; technical diagnostics are intentionally excluded./' scripts/leadgen-data-v2.py

      - name: Apply Leadgen v2 migration
        run: python3 scripts/leadgen-data-v2.py

      - name: Remove obsolete domain intelligence module
        run: |
          if git grep -n "leadgen-domain-intel" -- api src ':!api/_lib/leadgen-domain-intel.js'; then
            echo "A live runtime reference to leadgen-domain-intel remains" >&2
            exit 1
          fi
          git rm api/_lib/leadgen-domain-intel.js

      - name: Install Overture tile dependencies
        run: npm install --save --save-exact pmtiles@4.4.0 @mapbox/vector-tile@2.0.4 pbf@4.0.1

      - name: Huntington discovery smoke test
        run: node scripts/smoke-overture.mjs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify simplified enrichment surface
        run: |
          ! grep -q "PageSpeed\|technical quality\|domain age\|DNS/MX\|Analyze site" src/pages/Leadgen.jsx
          ! grep -q "leadgen-domain-intel" api/leadgen-emails.js
          grep -q "discoverOvertureBusinesses" api/leadgen.js
          grep -q "Find contacts" src/pages/Leadgen.jsx
          grep -q "leadgen-qualify" src/pages/Leadgen.jsx

      - name: Commit verified data upgrade
        run: |
          git config user.name 'Simple IT SRQ release bot'
          git config user.email '114784512+budokai-msi@users.noreply.github.com'
          git rm .github/workflows/leadgen-data-v2.yml scripts/leadgen-data-v2.py scripts/smoke-overture.mjs
          git add api/leadgen.js api/leadgen-emails.js api/_lib/leadgen-emailcrawler.js api/_lib/leadgen-overture.js src/pages/Leadgen.jsx src/styles/leadgen-cards.css package.json package-lock.json .env.example db/migrations/013_leadgen.sql
          git commit -m 'Replace Leadgen discovery with Overture Places'
          git push origin HEAD:main
