name: Security dependency refresh

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lock-and-verify:
    if: github.event.head_commit.message == 'Patch alerted dependency versions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact lockfile
        run: npm ci

      - name: Verify patched dependency versions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const pkgs = lock.packages || {};
          const expected = {
            'node_modules/react-router-dom': '7.18.2',
            'node_modules/react-router': '7.18.2',
            'node_modules/brace-expansion': '5.0.7',
            'node_modules/js-yaml': '3.15.0',
          };
          for (const [key, version] of Object.entries(expected)) {
            const actual = pkgs[key]?.version;
            if (actual !== version) throw new Error(`${key}: expected ${version}, got ${actual || 'missing'}`);
            console.log(`${key} = ${actual}`);
          }
          NODE

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'simpleitsrq-security-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh lockfile for dependency security fixes'
          git push origin HEAD:main
