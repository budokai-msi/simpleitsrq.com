name: One-time Leadgen Aura cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run one-time Leadgen Aura cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Clean public Leadgen surface
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/Leadgen.jsx')
          text = path.read_text()
          replacements = {
            'import LeadgenWorkspace from "../components/leadgen/LeadgenWorkspace";\n': '',
            '<Link to="/portal/leadgen" className="leadgen-app-portal-link">Campaign workspace</Link>': '<span className="leadgen-app-portal-link">Live market intelligence</span>',
            '<Link to="/portal/leadgen" className="btn btn-primary btn-sm">Connect CRM</Link>': '<span className="leadgen-app-private-note">CRM sync unlocks after account setup.</span>',
            '        <LeadgenWorkspace />\n': '',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Expected Leadgen fragment missing: {old[:90]}')
            text = text.replace(old, new)

          if '/portal/leadgen' in text:
            raise SystemExit('Public Leadgen still contains /portal/leadgen')
          path.write_text(text)
          PY
      - name: Commit cleanup and remove one-time workflow
        run: |
          git config user.name "Simple IT SRQ release bot"
          git config user.email "114784512+budokai-msi@users.noreply.github.com"
          git rm .github/workflows/one-time-leadgen-aura-cleanup.yml
          git add src/pages/Leadgen.jsx
          git commit -m "Polish public Leadgen Aura experience"
          git push origin HEAD:main
