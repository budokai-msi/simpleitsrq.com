name: Copy batch QA 2026-08-17

on:
  push:
    branches: [qa/copy-batch-20260817]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message != 'Copy batch QA passed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/copy-batch-20260817
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Record QA pass
        run: |
          printf 'unit-tests=passed\nbuild=passed\nbase-main-sha=32bc2f1bb10f9a5547383ced97bb04ff9f03c9c0\n' > .qa-copy-batch-pass
          git config user.name 'Simple IT SRQ QA'
          git config user.email '114784512+budokai-msi@users.noreply.github.com'
          git add .qa-copy-batch-pass
          git commit -m 'Copy batch QA passed'
          git push origin HEAD:qa/copy-batch-20260817
