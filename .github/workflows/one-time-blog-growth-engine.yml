name: One-time blog growth engine integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run blog growth engine integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Apply blog growth patch
        run: python scripts/one-time-blog-growth.py
      - name: Verify and commit
        run: |
          grep -q 'rankFreshStories(eligible' api/cron/agent.js
          grep -q 'SEO / SEARCH INTENT BRIEF' api/cron/agent.js
          grep -q 'BlogMonetizationSlot' src/pages/BlogPost.jsx
          ! grep -q 'AdUnit key=' src/pages/BlogPost.jsx
          grep -q 'VITE_ADSENSE_ENABLED=false' .env.example
          rm .github/workflows/one-time-blog-growth-engine.yml scripts/one-time-blog-growth.py .blog-growth-trigger
          git config user.name "Simple IT SRQ release bot"
          git config user.email "114784512+budokai-msi@users.noreply.github.com"
          git add api/cron/agent.js src/pages/BlogPost.jsx .env.example .github/workflows/one-time-blog-growth-engine.yml scripts/one-time-blog-growth.py .blog-growth-trigger
          git commit -m "Improve blog trend selection SEO and monetization"
          git push origin HEAD:main
