name: Pin Node 22 runtime

on:
  push:
    branches:
      - leadgen/cleanup-20260816

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: leadgen/cleanup-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin runtime major
        run: |
          npm pkg set engines.node='22.x'
          npm install --package-lock-only --ignore-scripts
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.engines.node!=='22.x'||l.packages[''].engines.node!=='22.x') process.exit(1)"
      - name: Install
        run: npm ci
      - name: Prove route has no legacy URL deprecation
        shell: bash
        run: |
          set -o pipefail
          NODE_OPTIONS='--pending-deprecation --trace-deprecation' node --input-type=module <<'NODE' 2>&1 | tee /tmp/node22-route.log
          process.env.NODE_ENV = "test";
          const mod = await import("./api/leadgen-integrations.js");
          const response = await mod.GET(new Request("https://simpleitsrq.com/api/leadgen-integrations"));
          console.log("route_status", response.status);
          NODE
          if grep -qE 'DEP0169|url\.parse\(\)' /tmp/node22-route.log; then
            echo 'Legacy URL parser warning still emitted by application route' >&2
            cat /tmp/node22-route.log >&2
            exit 1
          fi
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Keep only runtime files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
              package.json|package-lock.json|.github/workflows/trace-url-parse.yml|.github/workflows/pin-node22-runtime.yml) ;;
              *) git restore --worktree -- "$path" ;;
            esac
          done < <(git diff --name-only)
          rm -f .github/workflows/trace-url-parse.yml .github/workflows/pin-node22-runtime.yml
          test "$(node -p "require('./package.json').engines.node")" = '22.x'
          test "$(node -p "require('./package-lock.json').packages[''].engines.node")" = '22.x'
      - name: Commit validated runtime pin
        run: |
          git config user.name 'Simple IT SRQ release bot'
          git config user.email '114784512+budokai-msi@users.noreply.github.com'
          git add -A
          git commit -m 'Pin server runtime to Node 22'
          git push origin HEAD:leadgen/cleanup-20260816
          echo "VALIDATED_SHA=$(git rev-parse HEAD)"
